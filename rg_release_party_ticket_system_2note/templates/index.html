
{% extends "base.html" %}
{% block content %}
<section class="card">
    <div class="eyebrow">RSVP / TICKET</div>
    <h1>{{ event.name }}</h1>

    <div class="details">
        <p>{{ event.date }}</p>
        <p>{{ event.time }}</p>
        <p>{{ event.location }}</p>
    </div>

    <form method="post" class="form">
        <label>
            Nome
            <input name="name" type="text" placeholder="Es. Alessandro Rossi" required>
        </label>

        <label>
            Numero di telefono
            <input name="phone" type="tel" placeholder="Es. 333 123 4567" required>
        </label>

        <button type="submit">RICEVI TICKET</button>
    </form>
</section>
{% endblock %}
